security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            time_cost: 4
            memory_cost: 65536

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(?:_error|assets)/
            security: false
        main:
            lazy: true
            provider: users_in_memory

    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10240
