security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            time_cost: 4
            memory_cost: 65536

    providers:
        app_user_provider:
            id: App\Module\Identity\Infrastructure\DoctrineUserProvider

    role_hierarchy:
        ROLE_OWNER: ROLE_ADMINISTRATOR
        ROLE_ADMINISTRATOR: ROLE_OPERATOR
        ROLE_OPERATOR: ROLE_AUDITOR

    firewalls:
        dev:
            pattern: ^/(?:_error|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Module\Identity\Infrastructure\LoginFormAuthenticator
            entry_point: App\Module\Identity\Infrastructure\LoginFormAuthenticator

    access_control:
        - { path: '^/health/live$', roles: PUBLIC_ACCESS }
        - { path: '^/setup(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/login$', roles: PUBLIC_ACCESS }
        - { path: '^/password-reset(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/admin(?:/|$)', roles: ROLE_AUDITOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10240
