framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    trusted_proxies: '%emailer.trusted_proxies%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    session:
        handler_id: App\Module\Identity\Infrastructure\HybridSessionHandler
        name: EMAILERSESSID
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_path: /
        gc_probability: 1
        gc_divisor: 100
    php_errors:
        log: true
    rate_limiter:
        setup_challenge:
            policy: 'fixed_window'
            limit: 6
            interval: '15 minutes'
        setup_proof:
            policy: 'fixed_window'
            limit: 10
            interval: '15 minutes'
        setup_wizard:
            policy: 'fixed_window'
            limit: 60
            interval: '15 minutes'
        password_reset:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
