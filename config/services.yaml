parameters:
    emailer.default_private_dir: '%kernel.project_dir%/var/private'
    emailer.private_dir: '%env(default:emailer.default_private_dir:EMAILER_PRIVATE_DIR)%'
    emailer.setup_dir: '%emailer.private_dir%/setup'
    emailer.setup_state_file: '%emailer.setup_dir%/challenge.json'
    emailer.setup_cli_state_file: '%emailer.setup_dir%/cli-state.json'
    emailer.default_proof_file: '%kernel.project_dir%/.emailer-install-proof'
    emailer.proof_file: '%env(default:emailer.default_proof_file:EMAILER_INSTALL_PROOF_FILE)%'
    emailer.install_lock_file: '%emailer.private_dir%/install.lock'
    emailer.appearance_dir: '%emailer.private_dir%/appearance'
    emailer.import_dir: '%emailer.private_dir%/imports'
    emailer.template_asset_dir: '%emailer.private_dir%/template-assets'
    emailer.backup_dir: '%emailer.private_dir%/backups'
    emailer.default_backup_destination_dir: ''
    emailer.backup_destination_dir: '%env(default:emailer.default_backup_destination_dir:EMAILER_BACKUP_DESTINATION_DIR)%'
    emailer.default_recovery_key_file: ''
    emailer.recovery_key_file: '%env(default:emailer.default_recovery_key_file:EMAILER_RECOVERY_KEY_FILE)%'
    emailer.default_release_public_key_file: ''
    emailer.release_public_key_file: '%env(default:emailer.default_release_public_key_file:EMAILER_RELEASE_PUBLIC_KEY_FILE)%'
    emailer.default_releases_dir: ''
    emailer.releases_dir: '%env(default:emailer.default_releases_dir:EMAILER_RELEASES_DIR)%'
    emailer.default_runtime_configuration_file: ''
    emailer.runtime_configuration_file: '%env(default:emailer.default_runtime_configuration_file:EMAILER_RUNTIME_CONFIGURATION_FILE)%'
    emailer.default_transition_recovery_url: ''
    emailer.transition_recovery_url: '%env(default:emailer.default_transition_recovery_url:EMAILER_TRANSITION_RECOVERY_DATABASE_URL)%'
    emailer.product_id: 'emailer-ripe'
    emailer.app_version: '1.2.3'
    emailer.update_source_version: '%env(default:emailer.app_version:EMAILER_UPDATE_SOURCE_VERSION)%'
    emailer.schema_version: '20261015000000'
    emailer.default_uri: '%env(DEFAULT_URI)%'
    emailer.default_master_key_file: ''
    emailer.master_key_file: '%env(default:emailer.default_master_key_file:EMAILER_SECRET_KEY_FILE)%'
    emailer.default_edition_operation_file: ''
    emailer.edition_operation_file: '%env(default:emailer.default_edition_operation_file:EMAILER_INSTALLER_EDITION_OPERATION_FILE)%'
    emailer.default_source_service_prefix: 'emailer-light'
    emailer.source_service_prefix: '%env(default:emailer.default_source_service_prefix:EMAILER_INSTALLER_SOURCE_SERVICE_PREFIX)%'
    emailer.default_installer_hold: ''
    emailer.installer_hold: '%env(default:emailer.default_installer_hold:EMAILER_INSTALLER_HOLD_FILE)%'
    emailer.default_replacement_runtime: ''
    emailer.replacement_runtime: '%env(default:emailer.default_replacement_runtime:EMAILER_INSTALLER_REPLACEMENT_RUNTIME)%'
    emailer.default_installer_fence: '0'
    emailer.installer_fence: '%env(bool:default:emailer.default_installer_fence:EMAILER_INSTALLER_RETAIN_SOURCE_FENCE)%'
    emailer.default_http_mode: 'proxy'
    emailer.http_mode: '%env(default:emailer.default_http_mode:EMAILER_HTTP_MODE)%'
    env(TRUSTED_PROXIES): '127.0.0.1,::1'
    emailer.trusted_proxies: '%env(TRUSTED_PROXIES)%'
    emailer.default_trusted_hosts: '^(localhost|127\.0\.0\.1|\[::1\])$'
    emailer.trusted_hosts: '%env(default:emailer.default_trusted_hosts:TRUSTED_HOSTS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Module\Health\Application\Contract\ReadinessProbe:
            tags: ['emailer.readiness_probe']
        App\Module\Backup\Application\Contract\BackupContributor:
            tags: ['emailer.backup_contributor']
        App\Module\Operations\Application\Contract\OperationalStatusProvider:
            tags: ['emailer.operational_status_provider']

    App\:
        resource: '../src/'

    App\Module\Identity\Application\Contract\SecurityLevelReader:
        alias: App\Module\Configuration\Infrastructure\DoctrineSecurityLevelReader

    App\Infrastructure\Logging\RedactionProcessor:
        tags:
            - { name: monolog.processor }

    App\Module\Setup\Application\Contract\ChallengeStore:
        class: App\Module\Setup\Infrastructure\FilesystemChallengeStore
        arguments:
            $stateFile: '%emailer.setup_state_file%'

    App\Module\Setup\Application\Contract\InstallationLock:
        class: App\Module\Setup\Infrastructure\FilesystemInstallationLock
        arguments:
            $lockFile: '%emailer.install_lock_file%'

    App\Module\Setup\Application\Contract\ProofFile:
        class: App\Module\Setup\Infrastructure\FilesystemProofFile
        arguments:
            $proofFile: '%emailer.proof_file%'

    App\Module\Setup\Application\Contract\Clock:
        class: App\Module\Setup\Infrastructure\SystemClock

    App\Module\Setup\Application\Contract\RandomBytes:
        class: App\Module\Setup\Infrastructure\SecureRandomBytes

    App\Module\Setup\Application\Contract\ProductionDataDetector:
        class: App\Module\Setup\Infrastructure\DoctrineProductionDataDetector

    App\Module\Setup\Application\ChallengeIssuer:
        arguments:
            $lockFactory: '@lock.factory'

    App\Module\Setup\Application\ProofVerifier:
        arguments:
            $lockFactory: '@lock.factory'

    App\Module\Setup\Infrastructure\CliSetupStateStore:
        arguments:
            $stateFile: '%emailer.setup_cli_state_file%'

    App\Module\Setup\Application\Contract\CliSetupState: '@App\Module\Setup\Infrastructure\CliSetupStateStore'

    App\Module\Setup\Application\Contract\BackupValidator: '@App\Module\Backup\Infrastructure\VerifiedBackupValidator'

    App\Module\Setup\Infrastructure\SystemPreflight:
        arguments:
            $projectDirectory: '%kernel.project_dir%'
            $privateDirectory: '%emailer.private_dir%'

    App\Module\Setup\Application\Contract\Preflight: '@App\Module\Setup\Infrastructure\SystemPreflight'

    App\Module\Setup\Application\DatabaseSetup:
        arguments:
            $migrations: '@doctrine.migrations.dependency_factory'

    App\Module\Secrets\Infrastructure\FilesystemMasterKey:
        arguments:
            $keyFile: '%emailer.master_key_file%'
            $publicDirectory: '%kernel.project_dir%/public'
            $projectDirectory: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    App\Module\Secrets\Application\Contract\DirectoryDurability: '@App\Module\Secrets\Infrastructure\PosixDirectoryDurability'
    App\Module\Secrets\Application\Contract\FileDurability: '@App\Module\Secrets\Infrastructure\PosixFileDurability'

    App\Module\Secrets\Application\Contract\MasterKey: '@App\Module\Secrets\Infrastructure\CrashRecoveringMasterKey'
    App\Module\Secrets\Application\Contract\TransactionalMasterKey: '@App\Module\Secrets\Infrastructure\CrashRecoveringMasterKey'
    App\Module\Setup\Application\Contract\SetupLifecycle: '@App\Module\Setup\Infrastructure\LockedSetupLifecycle'
    App\Module\Secrets\Application\Contract\SecretVault: '@App\Module\Secrets\Infrastructure\DoctrineSecretVault'
    App\Module\Secrets\Application\Contract\RecoveryKeyVerifier: '@App\Module\Secrets\Application\RecoveryKeyExporter'
    App\Module\Setup\Application\Contract\SetupState: '@App\Module\Setup\Infrastructure\DoctrineSetupState'
    App\Module\Configuration\Application\Contract\ConfigurationSetup: '@App\Module\Configuration\Infrastructure\DoctrineConfigurationSetup'
    App\Module\Identity\Application\Contract\OwnerSetup: '@App\Module\Identity\Infrastructure\DoctrineOwnerSetup'
    App\Module\Identity\Application\Contract\AdministrativeUserLoader: '@App\Module\Identity\Infrastructure\DoctrineUserProvider'
    App\Module\Identity\Application\Contract\RecoveryCodeConsumer: '@App\Module\Identity\Infrastructure\DoctrineRecoveryCodeConsumer'
    App\Module\Health\Application\Contract\SetupDoctor: '@App\Module\Health\Infrastructure\Phase3SetupDoctor'
    App\Module\Health\Application\Contract\ScheduledHealthOperations: '@App\Module\Health\Application\Doctor'
    App\Module\Housekeeping\Application\Contract\RetentionOperations: '@App\Module\Housekeeping\Application\Housekeeper'
    App\Module\Operations\Application\Contract\OperationsPolicyReader: '@App\Module\Operations\Application\OperationsPolicy'
    App\Module\Operations\Application\Contract\OperationsPolicyWriter: '@App\Module\Operations\Application\OperationsPolicy'
    App\Module\Setup\Infrastructure\DoctrineInstallationFinalizer:
        arguments:
            $productVersion: '%emailer.app_version%'
            $productSchema: '%emailer.schema_version%'

    App\Module\Setup\Application\Contract\InstallationFinalizer: '@App\Module\Setup\Infrastructure\DoctrineInstallationFinalizer'
    App\Module\Audit\Application\Contract\AuditSink: '@App\Module\Audit\Infrastructure\DoctrineAuditSink'
    App\Module\Identity\Application\Contract\AdministrativeAuthorization: '@App\Module\Identity\Application\AuthorizationService'
    App\Module\Suppression\Application\Contract\SuppressionLookup: '@App\Module\Suppression\Application\SuppressionManager'
    App\Module\Suppression\Application\Contract\RecipientSuppression: '@App\Module\Suppression\Application\SuppressionManager'
    App\Module\Configuration\Application\Contract\RecipientRuntimeConfiguration: '@App\Module\Configuration\Infrastructure\DoctrineRecipientRuntimeConfiguration'
    App\Module\RecipientActions\Application\Contract\RecipientUnsubscribeLinks: '@App\Module\RecipientActions\Application\RecipientTokenService'
    App\Module\Analytics\Application\Contract\RecipientAnalyticsLinks: '@App\Module\RecipientActions\Application\RecipientAnalyticsService'
    App\Module\Analytics\Application\Contract\RecipientRsvpLinks: '@App\Module\RecipientActions\Application\RecipientAnalyticsService'
    App\Module\Contacts\Application\Contract\ImportStorage: '@App\Module\Contacts\Infrastructure\PrivateImportStorage'
    App\Module\Templates\Application\Contract\TemplateAssetStorage: '@App\Module\Templates\Infrastructure\TemplateAssetStore'
    App\Module\Contacts\Application\Contract\AudienceProvider: '@App\Module\Contacts\Infrastructure\DoctrineAudienceProvider'
    App\Module\Templates\Application\Contract\PublishedTemplateProvider: '@App\Module\Templates\Infrastructure\DoctrinePublishedTemplateProvider'
    App\Module\Configuration\Application\Contract\DeliveryConfiguration: '@App\Module\Configuration\Infrastructure\DoctrineDeliveryConfiguration'
    App\Module\Delivery\Application\Contract\CampaignDeliveryGateway: '@App\Module\Delivery\Infrastructure\DoctrineCampaignDeliveryGateway'
    App\Module\Delivery\Application\Contract\DeliveryTransport: '@App\Module\Delivery\Infrastructure\SymfonySmtpDeliveryTransport'
    App\Module\Delivery\Application\Contract\InterruptedDeliveryRecovery: '@App\Module\Delivery\Application\InterruptedDeliveryRecoverer'
    App\Module\Campaigns\Application\Contract\SendingGate: '@App\Module\Health\Infrastructure\CampaignSendingGate'
    App\Module\Delivery\Application\Contract\SendingGate: '@App\Module\Health\Infrastructure\DeliverySendingGate'

    App\Module\Health\Application\Doctor:
        arguments:
            $probes: !tagged_iterator emailer.readiness_probe

    App\Module\Backup\Application\BackupEngine:
        arguments:
            $contributors: !tagged_iterator emailer.backup_contributor
            $backupDirectory: '%emailer.backup_dir%'
            $sourceVersion: '%emailer.update_source_version%'
            $drillEvidence: '@App\Module\Backup\Application\RestoreDrillEvidence'
            $audit: '@App\Module\Audit\Application\Contract\AuditSink'

    App\Module\Operations\Application\OperationsDashboard:
        arguments:
            $providers: !tagged_iterator emailer.operational_status_provider

    App\Module\Release\Infrastructure\OperationalReleaseStatus:
        arguments:
            $appVersion: '%emailer.app_version%'

    App\Module\Backup\Infrastructure\FilesystemBackupDestination:
        arguments:
            $destinationDirectory: '%emailer.backup_destination_dir%'
            $projectDirectory: '%kernel.project_dir%'
            $privateDirectory: '%emailer.private_dir%'

    App\Module\Backup\Application\Contract\BackupOperations: '@App\Module\Backup\Application\BackupEngine'
    App\Module\Backup\Application\Contract\ExternalBackupDestination: '@App\Module\Backup\Infrastructure\FilesystemBackupDestination'
    App\Module\Backup\Application\Contract\AutomatedBackupOperations: '@App\Module\Backup\Application\BackupAutomation'
    App\Module\Backup\Application\Contract\BackupRetentionOperations: '@App\Module\Backup\Application\BackupAutomation'

    App\Module\Backup\Application\BackupAutomation:
        arguments:
            $backupDirectory: '%emailer.backup_dir%'

    App\Module\Health\Application\Contract\RuntimeVerification: '@App\Module\Health\Application\Doctor'

    App\Module\Health\Infrastructure\SystemReadinessProbe:
        arguments:
            $privateDirectory: '%emailer.private_dir%'
            $projectDirectory: '%kernel.project_dir%'
            $canonicalUri: '%emailer.default_uri%'
            $environment: '%kernel.environment%'
            $trustedProxies: '%emailer.trusted_proxies%'
            $httpMode: '%emailer.http_mode%'
            $trustedHosts: '%emailer.trusted_hosts%'
            $expectedSchemaVersion: '%emailer.schema_version%'
            $releasesDirectory: '%emailer.releases_dir%'
            $releasePublicKeyFile: '%emailer.release_public_key_file%'

    App\Module\Configuration\Infrastructure\ConfigurationReadinessProbe:
        arguments:
            $canonicalUri: '%emailer.default_uri%'
            $environment: '%kernel.environment%'

    App\Module\Delivery\Infrastructure\DeliveryReadinessProbe:
        arguments:
            $environment: '%kernel.environment%'

    App\Module\Delivery\Infrastructure\OutboundMimeMessageFactory:
        arguments:
            $canonicalUri: '%emailer.default_uri%'

    App\Module\Backup\Infrastructure\BackupReadinessProbe:
        arguments:
            $backupDirectory: '%emailer.backup_dir%'
            $recoveryKeyFile: '%emailer.recovery_key_file%'
            $environment: '%kernel.environment%'

    App\Module\Identity\Infrastructure\IdentityReadinessProbe:
        arguments:
            $environment: '%kernel.environment%'

    App\Module\Secrets\Application\RecoveryKeyExporter:
        arguments:
            $outputFile: '%emailer.recovery_key_file%'

    App\Module\Templates\Infrastructure\TemplatesBackupContributor:
        arguments:
            $assetDirectory: '%emailer.template_asset_dir%'

    App\Module\Release\Application\PackageInspector:
        arguments:
            $publicKeyFile: '%emailer.release_public_key_file%'
            $currentVersion: '%emailer.update_source_version%'

    App\Module\Release\Application\ReleaseManager:
        arguments:
            $replacementRuntimeFile: '%emailer.replacement_runtime%'
            $retainSourceFence: '%emailer.installer_fence%'
            $privateDirectory: '%emailer.private_dir%'
            $masterKeyFile: '%emailer.master_key_file%'
            $runtimeConfigurationFile: '%emailer.runtime_configuration_file%'
            $releasesDirectory: '%emailer.releases_dir%'
            $currentVersion: '%emailer.update_source_version%'
            $environment: '%kernel.environment%'

    App\Module\Release\Presentation\Cli\CheckReleaseCommand:
        arguments:
            $releasesDirectory: '%emailer.releases_dir%'
            $version: '%emailer.app_version%'

    App\Module\Release\Presentation\Http\ReleaseController:
        arguments:
            $releasesDirectory: '%emailer.releases_dir%'
            $version: '%emailer.app_version%'

    App\Module\Delivery\Infrastructure\SymfonySmtpDeliveryTransport:
        arguments:
            $environment: '%kernel.environment%'

    App\Module\Contacts\Infrastructure\PrivateImportStorage:
        arguments:
            $directory: '%emailer.import_dir%'

    App\Module\Templates\Infrastructure\TemplateAssetStore:
        arguments:
            $directory: '%emailer.template_asset_dir%'

    App\Module\Identity\Application\SensitiveValueHasher:
        arguments:
            $key: '%env(APP_SECRET)%'

    App\Module\RecipientActions\Presentation\Http\RecipientActionLimiterSubscriber:
        arguments:
            $key: '%env(APP_SECRET)%'

    App\Module\Identity\Infrastructure\HybridSessionHandler:
        arguments:
            $setupSessionDirectory: '%emailer.private_dir%/sessions'

    App\Module\Configuration\Infrastructure\DoctrineConfigurationSetup:
        arguments:
            $projectDirectory: '%kernel.project_dir%'

    App\Module\Setup\Presentation\Http\SetupController:
        arguments:
            $proofPath: '%emailer.proof_file%'

    App\Module\Setup\Presentation\Cli\SetupInstallCommand:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'
            $canonicalUri: '%emailer.default_uri%'
            $backupDestinationDirectory: '%emailer.backup_destination_dir%'

    App\Module\Identity\Application\Contract\SensitiveActionAuthorizer: '@App\Module\Identity\Application\ReauthenticationService'
    App\Module\Suppression\Application\Contract\AddressCorrectionSuppression: '@App\Module\Suppression\Application\SuppressionManager'
    App\Module\Templates\Application\Contract\CampaignTemplatePreparation: '@App\Module\Templates\Application\TemplateManager'
    App\Module\Contacts\Application\Contract\CampaignAudiencePreparation: '@App\Module\Contacts\Application\CampaignAudiencePreparation'

    App\Shared\EditionDeliveryHold:
        arguments:
            $privateDirectory: '%emailer.private_dir%'

    App\Module\Release\Application\LightSourceInspection:
        arguments:
            $projectDirectory: '%kernel.project_dir%'
            $privateDirectory: '%emailer.private_dir%'
            $masterKeyFile: '%emailer.master_key_file%'

    App\Module\Release\Application\LightSchemaTransition:
        arguments:
            $projectDirectory: '%kernel.project_dir%'

    App\Module\Release\Application\Contract\EditionUpgrade: '@App\Module\Release\Application\LightUpgradeInstaller'

    App\Module\Release\Application\LightUpgradeInstaller:
        arguments:
            $sourceServicePrefix: '%emailer.source_service_prefix%'
            $operationReceiptFile: '%emailer.edition_operation_file%'
            $retainSourceFence: '%emailer.installer_fence%'
            $projectDirectory: '%kernel.project_dir%'
            $privateDirectory: '%emailer.private_dir%'
            $masterKeyFile: '%emailer.master_key_file%'
            $releasesDirectory: '%emailer.releases_dir%'
            $recoveryDatabaseUrl: '%emailer.transition_recovery_url%'
            $runtimeConfigurationFile: '%emailer.runtime_configuration_file%'
            $ripePublicKeyFile: '%emailer.release_public_key_file%'
            $ripeRecoveryKeyFile: '%emailer.recovery_key_file%'
            $environment: '%kernel.environment%'

    App\Module\Secrets\Application\Contract\LightSecretInspection: '@App\Module\Secrets\Application\LightSecretVerifier'

    App\Module\Secrets\Application\Contract\RipeRecoveryKeyProvisioning: '@App\Module\Secrets\Application\RecoveryKeyExporter'

    App\Module\Release\Application\SourceDatabaseFence:
        arguments:
            $replacementRuntimeFile: '%emailer.replacement_runtime%'
            $runtimeConfigurationFile: '%emailer.runtime_configuration_file%'

    App\Module\Configuration\Application\Contract\MailProbe: '@App\Module\Configuration\Infrastructure\SmtpMailProbe'

    App\Module\Configuration\Infrastructure\SmtpMailProbe:
        arguments:
            $environment: '%kernel.environment%'

    App\Shared\InstallerDeliveryHold:
        arguments:
            $holdFile: '%emailer.installer_hold%'

    App\Module\Configuration\Application\AppearanceSettings:
        arguments:
            $appearanceDirectory: '%emailer.appearance_dir%'

    App\Module\Configuration\Application\Contract\AppearanceInitialization:
        alias: App\Module\Configuration\Application\AppearanceSettings

    App\Module\Configuration\Application\Contract\PublicWebsiteClient:
        alias: App\Module\Configuration\Infrastructure\CurlPublicWebsiteClient

    App\Module\Configuration\Infrastructure\AppearanceBackupContributor:
        arguments:
            $appearanceDirectory: '%emailer.appearance_dir%'

    App\Module\Configuration\Application\Contract\PublicDnsResolver:
        alias: App\Module\Configuration\Infrastructure\BoundedPublicDnsResolver
